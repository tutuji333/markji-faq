site_name: 墨墨记忆卡常见问答
site_description: 面向终端用户的高频问题与故障排查站点
site_url: https://tutuji333.github.io/markji-faq/
repo_url: https://github.com/tutuji333/markji-faq
repo_name: markji-faq
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - search.suggest
    - search.highlight
    - toc.follow
  logo: assets/images/favicon.png

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/faq-extra.css

nav:
  - 首页: index.md
  - 更新日志: changelog.md
  - 我该去哪里求助？: getting-help.md
  - 学习与复习:
      - 学习与复习总览: study-cards.md
      - 为什么设 20 只安排几张: questions/study/daily-new-cards.md
      - 新学受复习上限影响: questions/study/review-limit-toggle.md
      - 考前冲刺用练习模式还是提前复习: questions/study/exam-cram.md
      - 一键选卡不见了: questions/study/one-tap-selection-missing.md
      - 暂停某个牌组复习: questions/study/pause-a-deck.md
      - 模糊完成复习功能不见了: questions/study/fuzzy-completes-review.md
      - 如何点认识 / 模糊 / 忘记: questions/study/how-to-use-feedback-buttons.md
      - 如何查看记忆历史与下次复习安排: questions/study/memory-history.md
      - 卡片大量逾期堆积怎么办: questions/study/overdue-card-backlog.md
      - 初次认识后复习间隔不同: questions/study/first-review-interval-different.md
      - 复习间隔为什么突然变长: questions/study/review-interval-too-long.md
      - 重置数据 vs 移出记忆: questions/study/reset-vs-remove-memory.md
  - 牌组与卡片:
      - 牌组与卡片总览: decks-cards.md
      - 单张卡片换牌组: questions/decks/move-card-between-decks.md
      - 收藏牌组能否自由增删改: questions/decks/edit-collected-deck.md
      - 原作者删除后是否消失: questions/decks/collected-deck-after-author-deletes.md
      - 如何把牌组分享给朋友: questions/decks/share-deck.md
      - 如何让好友免费学习共享牌组: questions/decks/share-deck-with-friends.md
      - 修改过的卡片如何恢复: questions/decks/restore-edited-card.md
  - 签到、账号与同步:
      - 签到、账号与同步总览: account-sync.md
      - 补签按钮在哪里: questions/sign-in/make-up-sign-in.md
      - 提前签到有什么用: questions/sign-in/early-sign-in.md
      - 签到有什么用: questions/sign-in/why-sign-in.md
  - 专业版与记忆币:
      - 专业版与记忆币总览: pro-membership.md
      - 终身会员升级: questions/pro/lifetime-upgrade.md
      - 收藏牌组消耗减免: questions/pro/collected-deck-discount.md
      - 牌组学习消耗设置: questions/pro/learning-cost-setting.md
      - 更大容量: questions/pro/larger-capacity.md
      - 安卓找不到专业版入口: questions/pro/android-pro-entry.md
      - 专业版语音次数: questions/pro/pro-tts-quota.md
  - 导入与迁移:
      - 导入与迁移总览: import-export.md
      - 哪些 apkg 更容易导入成功: questions/import/apkg-compatibility.md
  - 网页版、语音与搜索:
      - 网页版、语音与搜索总览: web-editing.md
      - 快速生成语音: questions/web/quick-speech.md
      - 网页版精准搜索: questions/web/web-search.md
      - 图片遮盖更适合网页端: questions/web/image-masking.md
  - 制卡与创作:
      - 制卡与创作总览: content-creation.md
      - Markji 制卡语法关键指南: questions/content/card-syntax-guide.md
      - 制卡语法、视频教程和创作者资料去哪里找: questions/content/creation-resources.md
      - 如何更高效地批量制卡: questions/content/batch-card-making.md
      - 选择题怎么加答案解析: questions/content/choice-question-explanations.md
      - 理工科公式、答案线和特殊格式怎么处理: questions/content/formulas-and-answer-lines.md
      - 如何更高效地批量生成语音: questions/content/batch-audio.md
      - 当前支持 Markdown / 表格 / 代码块吗: questions/content/markdown-support.md
  - 故障排查:
      - 出现问题时先做什么？: troubleshooting.md
      - 手机端 App 登录失败: questions/troubleshooting/app-login-failed.md
      - apkg 文件解析失败: questions/troubleshooting/apkg-parse-failed.md
      - Anki 导入失败或乱码: questions/troubleshooting/anki-import-garbled.md
      - 新学受复习上限影响异常: questions/troubleshooting/review-limit-bug.md
      - 登录时数据解压密码错误: questions/troubleshooting/login-data-error.md
      - 跨设备同步失败: questions/troubleshooting/sync-failed.md
      - 签到失败或没看到按钮: questions/troubleshooting/sign-in-failed.md
      - 网页功能或导出异常: questions/troubleshooting/web-export-bug.md
